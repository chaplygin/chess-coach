name: Build APK

on:
  push:
    # Ветки smoke/** проверяют сборку в эмуляторе и ничего не публикуют.
    branches: [main, 'smoke/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Сборка из main, которую приложение увидит как обновление.
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Готовое действие setup-android@v3 ставит давно удалённый пакет "tools"
      # и падает. Android SDK на раннере уже есть, поэтому доустанавливаем
      # только то, что нужно, и делаем это явно.
      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # Бинарник в git не кладём. Он меняется только с коммитом исходников в
      # скрипте, поэтому собирается один раз, а дальше берётся из кэша.
      - name: Restore Stockfish lite
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libstockfish.so
          key: stockfish-lite-${{ hashFiles('tools/ci/build_stockfish_lite.sh') }}

      - name: Build Stockfish lite
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        env:
          JNI_LIBS_DIR: app/src/main/jniLibs/arm64-v8a
        run: bash tools/ci/build_stockfish_lite.sh

      # Android 15+ работает на устройствах со страницей 16 КБ, поэтому
      # выравнивание проверяем, а не предполагаем.
      - name: Check 16 KB page alignment
        run: python3 tools/ci/check_elf_align.py app/src/main/jniLibs/arm64-v8a/libstockfish.so

      # Логика тренера живёт в чистых JVM-модулях и проверяется без Android SDK
      # и без телефона. Падение здесь должно ломать сборку раньше, чем соберётся APK.
      - name: Unit tests (:core, :coach, :lichess)
        run: ./gradlew :core:test :coach:test :lichess:testDebugUnitTest --stacktrace

      # Ключ постоянный, иначе Android не поставит новую сборку поверх старой.
      # В pull request секретов нет: там APK подписан отладочным ключом и никуда не уходит.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-signing.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release-signing.p12" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK with a traceable name
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/chesscoach-0.2.${GITHUB_RUN_NUMBER}.apk"
          ls -lh out/
          # Пустой jniLibs не ломает сборку — ошибка вылезла бы только на телефоне.
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/arm64-v8a/libstockfish.so'; then
            echo "Проверено: libstockfish.so внутри APK"
          else
            echo "ОШИБКА: libstockfish.so не попал в APK" >&2
            exit 1
          fi

      # Имя артефакта постоянное, чтобы `gh run download --name chesscoach-debug`
      # всегда работал одинаково. Имя файла внутри содержит версию приложения.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chesscoach-debug
          path: out/*.apk
          retention-days: 30

      # Приложение проверяет обновления по этому релизу. APK с другой подписью
      # публиковать нельзя: поверх установленного он всё равно не встанет.
      - name: Publish release
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          cp out/*.apk chesscoach.apk
          git log -1 --format=%s > notes.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" chesscoach.apk --clobber
          else
            gh release create "$TAG" chesscoach.apk --title "$VERSION" --notes-file notes.txt --latest
          fi

      - name: Warn about missing signing key
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::Нет секрета SIGNING_KEYSTORE_BASE64, релиз APK не опубликован"

      - name: Publish test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            coach/build/reports/tests/
            lichess/build/reports/tests/
          retention-days: 7

  smoke:
    if: startsWith(github.ref, 'refs/heads/smoke/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: chesscoach-debug
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/ci/smoke_emulator.sh

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            smoke-screen.png
            smoke-logcat.txt
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble site
        run: bash tools/ci/build_site.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/site

  deploy-web:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Сайт выходит только вместе с APK: при упавшей сборке версии не разойдутся.
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
